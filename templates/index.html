<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('assets', filename='css/style.css') }}">

    <title>CWD - Generator Postaci</title>
    <style>
        body {
            background-image: url("{{ url_for('static', filename='bg.jpg') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
    </style>

</head>
<body>
<div class="app-shell">
    <main class="stage">
        <div class="stage-left">
            <header class="workspace-header">
                <img src="{{ url_for('static', filename='cwd_logo.png') }}" alt="CWD Logo" class="logo">
                <progress-navigator aria-label="Poziomy tworzenia postaci"></progress-navigator>
            </header>
            <wizard-shell aria-label="Kreator bohatera"></wizard-shell>
        </div>

        <section id="pdf-panel" class="pdf-panel">
            <div class="pdf-panel-header">
                <h3 class="section-title">Twoja Karta Postaci</h3>
                <button id="close-pdf-panel" class="pdf-panel-close" type="button" aria-label="Zamknij podgląd">&times;</button>
            </div>
            <iframe id="hero-frame" src="about:blank" title="Podgląd karty postaci"></iframe>
        </section>
    </main>
</div>

<button id="open-sheet-btn" class="sheet-fab" type="button" aria-controls="pdf-panel" aria-expanded="false">◉ <span>Podgląd karty</span></button>
<div id="event-toast" class="event-toast" role="status" aria-live="polite"></div>

<footer class="footer">
    Created by Tomasz Guzik, <a href="https://www.youtube.com/@Guzikologia" target="_blank">Guzikologia</a> |
    Translation & publishing by Alis.Games, <a href="https://alisgames.pl/pl_PL/" target="_blank">Alis.Games</a> |
    RPG game by Robert Shwalb, <a href="https://schwalbentertainment.com/shadow-of-the-demon-lord/" target="_blank">Schwalb
    Entertainment</a>
</footer>

<img src="{{ url_for('static', filename='goblin.png') }}" alt="Goblin" class="corner-img goblin-img">
<img src="{{ url_for('static', filename='dwarf.png') }}" alt="Dwarf" class="corner-img dwarf-img">

<script src="{{ url_for('assets', filename='js/creation_store.js') }}"></script>
<script>
    // Data handed off from the server for the wizard's JS components: the
    // ancestry tooltip copy used by <ancestry-picker>, and the Novice/
    // Expert/Master path catalogs used by <path-picker>/<random-config-screen>.
    window.ancestryDescriptions = JSON.parse('{{ ancestry_descriptions | tojson | safe }}');
    window.PATH_CATALOG = {
        novice: JSON.parse('{{ novice_paths | tojson | safe }}'),
        expert: JSON.parse('{{ expert_paths | tojson | safe }}'),
        master: JSON.parse('{{ master_paths | tojson | safe }}')
    };

    let currentDownloadUrl = null;

    function showPdfPanel() {
        document.getElementById('pdf-panel').classList.add('visible');
    }

    function hidePdfPanel() {
        document.getElementById('pdf-panel').classList.remove('visible');
    }
    window.hidePdfPanel = hidePdfPanel;

    // The crossroads screen's "Zapisz PDF" button and the random-mode
    // generate flow both resolve into this same "completed" event, so the
    // preview iframe/panel logic only lives in one place.
    window.creationStore.addEventListener('completed', (event) => {
        const downloadUrl = event.detail && event.detail.downloadUrl;
        if (!downloadUrl) {
            return;
        }
        const iframe = document.getElementById('hero-frame');
        const timestamp = new Date().getTime();
        iframe.src = `${downloadUrl}?t=${timestamp}#zoom=110`;
        currentDownloadUrl = downloadUrl.includes('?') ? `${downloadUrl}&download=1` : `${downloadUrl}?download=1`;
        showPdfPanel();
    });

    window.creationStore.addEventListener('finalized', (event) => {
        if (currentDownloadUrl) {
            if (window.showWizardToast) {
                window.showWizardToast("Trwa generowanie i zapisywanie karty PDF...");
            }
            const link = document.createElement('a');
            link.href = currentDownloadUrl;
            link.download = 'Karta_Postaci_SotDL.pdf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    });
</script>
<script src="{{ url_for('assets', filename='js/wizard.js') }}" defer></script>
</body>
</html>
