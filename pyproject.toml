[project]
name = "sotdl-hero-creator-app"
version = "0.1.0"
description = "Web-based Shadow of the Demon Lord hero creator"
requires-python = ">=3.12"
dependencies = [
    "Flask",
    "pypdf",
    "reportlab",
    "pydantic",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["output"]

[tool.ruff.lint]
select = ["E", "F", "W"]